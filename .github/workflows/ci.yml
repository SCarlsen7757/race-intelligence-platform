name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Everything that needs a Linux container runtime. The Testcontainers (Persistence) and Aspire
  # (Ingest.Api) suites skip themselves when no container runtime is present, so a runner without
  # Docker would report green while silently testing nothing — ubuntu-latest ships a running daemon.
  linux:
    name: Build and test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          # Reads the SDK version out of global.json (10.0.400, rollForward latestFeature) so CI
          # and developer machines can never drift onto different SDKs. That floor is load-bearing
          # rather than housekeeping: the channel source generator is compiled against Roslyn 5.9.0,
          # and an SDK below 10.0.400 ships an older Roslyn that would skip the analyzer (CS9057)
          # and fail the build with a hundred and seventy-five missing members.
          global-json-file: global.json

      - name: Restore
        run: dotnet restore RaceIntelligence.slnx

      # Each schema dump is generated from its migrations and committed, so the schema is
      # reviewable as a schema and so the knowledge graph can read it without a database. Nothing
      # else fails when one goes stale — the tests build their database from the migrations, not
      # from these files — so a forgotten regeneration would otherwise sit unnoticed until someone
      # trusted the file.
      #
      # There is more than one, and there will be one more per simulator: storage is one database
      # per simulator (ADR 0001) and the identity registry has its own besides (ADR 0002). The list
      # below is the same list `tools/update-graph.py` keeps in `STORES`; the two have to stay in
      # step, and a new simulator adds a line to each.
      #
      # Regenerating and diffing is the whole check. `dotnet ef migrations script` is deterministic
      # (verified: identical bytes across runs), and .gitattributes normalizes to LF, so the CRLF
      # this writes on a Windows developer's machine does not register as a difference.
      - name: Verify the schema dumps match their migrations
        run: |
          dotnet tool install --global dotnet-ef
          stores=(
            "src/RaceIntelligence.Persistence.RaceRoom:RaceRoomDbContext:docs/raceroom-schema.sql"
            "src/RaceIntelligence.Identity:IdentityDbContext:docs/identity-schema.sql"
          )
          for store in "${stores[@]}"; do
            IFS=: read -r project context dump <<< "$store"
            regenerate="dotnet ef migrations script --project $project --context $context --output $dump"
            $regenerate
            if ! git diff --exit-code -- "$dump"; then
              echo "::error file=$dump::Out of date. Regenerate it in the same commit as the migration: $regenerate"
              exit 1
            fi
          done

      - name: Build
        # Directory.Build.props already sets TreatWarningsAsErrors=true; -warnaserror also promotes
        # warnings raised outside that property's reach. The repo builds with zero warnings today,
        # so anything new here is a genuine regression and must fail the run rather than scroll by.
        # --no-incremental forces a full compile so a warning cannot be skipped as up-to-date.
        run: dotnet build RaceIntelligence.slnx --configuration Release --no-restore --no-incremental -warnaserror

      - name: Test
        # Every suite except the RaceRoom connector, which is covered by the windows job below.
        #
        # Listed explicitly, because which suites run is worth reading in this file. The list used
        # to be trusted on its own, on the grounds that a missing entry would be "visible here
        # rather than silently unrun" — and that is precisely what did not happen: the identity
        # registry arrived with its own suite, nobody added it, and CI stayed green while those
        # tests never ran. So the list is now checked against what is actually on disk, and a
        # project nobody listed fails the run instead of disappearing.
        #
        # Two things here are load-bearing and were both verified by running them in a Linux
        # container, because getting either wrong fails quietly rather than loudly:
        #   - the full .csproj path, not the directory: a directory reports "No test projects were
        #     found" instead of running anything;
        #   - no --no-build: these projects run on Microsoft.Testing.Platform, and --no-build makes
        #     discovery report "No test projects were found" too. Rebuilding costs seconds.
        run: |
          suites=(
            tests/RaceIntelligence.Analysis.Tests/RaceIntelligence.Analysis.Tests.csproj
            tests/RaceIntelligence.Collector.Plugins.Ingest.Tests/RaceIntelligence.Collector.Plugins.Ingest.Tests.csproj
            tests/RaceIntelligence.Collector.Plugins.Live.Tests/RaceIntelligence.Collector.Plugins.Live.Tests.csproj
            tests/RaceIntelligence.Collector.Tests/RaceIntelligence.Collector.Tests.csproj
            tests/RaceIntelligence.Core.Tests/RaceIntelligence.Core.Tests.csproj
            tests/RaceIntelligence.Identity.Tests/RaceIntelligence.Identity.Tests.csproj
            tests/RaceIntelligence.Ingest.Api.Tests/RaceIntelligence.Ingest.Api.Tests.csproj
            tests/RaceIntelligence.Live.Contracts.Tests/RaceIntelligence.Live.Contracts.Tests.csproj
            tests/RaceIntelligence.Persistence.RaceRoom.Tests/RaceIntelligence.Persistence.RaceRoom.Tests.csproj
            tests/RaceIntelligence.RaceRoom.Channels.Tests/RaceIntelligence.RaceRoom.Channels.Tests.csproj
            tests/RaceIntelligence.Read.Api.Tests/RaceIntelligence.Read.Api.Tests.csproj
            tests/RaceIntelligence.Web.Tests/RaceIntelligence.Web.Tests.csproj
          )

          # TestSupport is a helper library rather than a suite; the RaceRoom connector needs
          # Windows shared memory and runs in the job below.
          for found in tests/*/*.csproj; do
            case "$found" in
              *.TestSupport/*|*Connectors.RaceRoom.Tests/*) continue ;;
            esac
            listed=0
            for suite in "${suites[@]}"; do
              if [ "$suite" = "$found" ]; then listed=1; fi
            done
            if [ "$listed" -eq 0 ]; then
              echo "::error file=.github/workflows/ci.yml::$found exists but is not in the suite list above, so it would never run. Add it."
              exit 1
            fi
          done

          for suite in "${suites[@]}"; do
            dotnet test "$suite" --configuration Release
          done

  # The dashboard. Separate from the .NET jobs because it needs Node rather than the SDK, and
  # because a TypeScript error should read as a frontend failure rather than as part of a build log
  # for six C# projects.
  #
  # It is its own deployable now — a Node process on its own origin, no longer built into the hub's
  # wwwroot by `dotnet publish` — so nothing else in this workflow would notice it breaking.
  # Without this job a dashboard that does not typecheck, lint, test or build reaches main.
  dashboard:
    name: Build and test (dashboard)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: src/RaceIntelligence.Dashboard

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/RaceIntelligence.Dashboard/package-lock.json

      # `ci` rather than `install`: it installs exactly what the lock file pins and fails if the
      # lock file and package.json disagree, so CI cannot pass against dependencies a developer's
      # machine never had.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # ESLint plus a Prettier formatting check. The formatting half is what keeps a diff about
      # behaviour from also being a diff about whitespace.
      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      # Builds both halves — the client bundle and the Node server — because a TanStack Start app
      # that compiles in the browser environment can still fail in the SSR one.
      - name: Build
        run: npx vite build

      # app/routeTree.gen.ts is generated from app/routes/ by the Start plugin and committed, so
      # `npm run typecheck` works without a build step first. The build above has just regenerated
      # it, so a difference here means a route was added or renamed without committing the result —
      # which typechecks locally against the stale file and fails for the next person to build.
      - name: Verify the generated route tree is current
        run: |
          git diff --exit-code -- app/routeTree.gen.ts \
            || { echo "::error file=src/RaceIntelligence.Dashboard/app/routeTree.gen.ts::Out of date. Run npm run build and commit the result."; exit 1; }

  # The RaceRoom connector reads the sim's shared memory through a *named* memory-mapped file
  # (MemoryMappedFile.OpenExisting(name, ...)), and named maps are a Windows-only feature — on Unix
  # they throw PlatformNotSupportedException. So this suite cannot run on the Linux job, and
  # skipping it there instead would leave the interop code with no CI coverage at all.
  # Windows runners have no Linux Docker, which is why they run only this suite: it needs no
  # container, and everything that does stays on the Linux job.
  windows:
    name: Connector interop tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Test
        # Builds as part of the run: this job compiles only the connector suite and its references,
        # so a separate build step would duplicate that work for no extra signal. The Linux job is
        # the one that enforces a zero-warning full-solution compile.
        run: dotnet test tests/RaceIntelligence.Connectors.RaceRoom.Tests/RaceIntelligence.Connectors.RaceRoom.Tests.csproj --configuration Release

  # The container images, built exactly as a deploy builds them.
  #
  # This job exists because a deploy found a bug the rest of CI could not: the channel manifest lives
  # in channels/ at the repository root, outside src/, and the backend Dockerfiles copied only
  # global.json, the two props files and src/. `dotnet build` on the solution was perfectly happy —
  # the file was there on disk — while `docker build` failed with CS2001 on a file the Roslyn
  # generator needs at compile time. Nothing between a green PR and a broken deploy noticed.
  #
  # Build only, no push: the point is that the Dockerfiles still describe a working build, and a
  # registry is not needed to answer that. The dashboard image is included because its build runs
  # `tsc` and `vite build` inside the image, against a context the .dockerignore has filtered — a
  # different question from the dashboard job above, which runs them against the working tree.
  images:
    name: Build container images
    runs-on: ubuntu-latest
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: web
            dockerfile: src/RaceIntelligence.Web/Dockerfile
          - service: ingest-api
            dockerfile: src/RaceIntelligence.Ingest.RaceRoom/Dockerfile
          - service: read-api
            dockerfile: src/RaceIntelligence.Read.RaceRoom/Dockerfile
          - service: dashboard
            dockerfile: src/RaceIntelligence.Dashboard/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: ${{ matrix.service == 'dashboard' }}
          tags: ci-${{ matrix.service }}:test
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # Building the dashboard image is not the same as running it, and the gap between the two is
      # a real failure this repository has already had: `srvx`, `@tanstack/react-router` and
      # `@tanstack/react-start` are imported by the built server at run time but were moved into
      # devDependencies by an `npm install -D`. The runtime stage installs `--omit=dev`, so the
      # image built perfectly and then crash-looped with ERR_MODULE_NOT_FOUND.
      #
      # Only the dashboard is smoke-tested here. The backend images need a database to get past
      # startup, which is what the Aspire and Testcontainers suites already cover; this one needs
      # nothing but a port.
      - name: Smoke-test the dashboard image
        if: matrix.service == 'dashboard'
        run: |
          docker run -d --name dashboard-smoke -p 3000:3000 ci-dashboard:test

          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://localhost:3000/; then
              echo "dashboard answered on attempt $i"
              docker rm -f dashboard-smoke >/dev/null
              exit 0
            fi
            # A container that has already died will never answer, so stop waiting for it.
            if [ "$(docker inspect -f '{{.State.Running}}' dashboard-smoke)" != "true" ]; then
              echo "::error file=src/RaceIntelligence.Dashboard/Dockerfile::The dashboard container exited instead of serving."
              docker logs dashboard-smoke
              exit 1
            fi
            sleep 2
          done

          echo "::error file=src/RaceIntelligence.Dashboard/Dockerfile::The dashboard image never served a response."
          docker logs dashboard-smoke
          exit 1
