name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Everything that needs a Linux container runtime. The Testcontainers (Persistence) and Aspire
  # (Ingest.Api) suites skip themselves when no container runtime is present, so a runner without
  # Docker would report green while silently testing nothing — ubuntu-latest ships a running daemon.
  linux:
    name: Build and test (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          # Reads the SDK version out of global.json (10.0.302, rollForward latestFeature) so CI
          # and developer machines can never drift onto different SDKs.
          global-json-file: global.json

      - name: Restore
        run: dotnet restore RaceIntelligence.slnx

      # docs/schema.sql is generated from the migrations and committed, so the schema is reviewable
      # as a schema and so the knowledge graph can read it without a database. Nothing else fails
      # when it goes stale — the tests build their database from the migrations, not from this file
      # — so a forgotten regeneration would otherwise sit unnoticed until someone trusted the file.
      #
      # Regenerating and diffing is the whole check. `dotnet ef migrations script` is deterministic
      # (verified: identical bytes across runs), and .gitattributes normalizes the file to LF, so
      # the CRLF this writes on a Windows developer's machine does not register as a difference.
      - name: Verify docs/schema.sql matches the migrations
        run: |
          dotnet tool install --global dotnet-ef
          dotnet ef migrations script --project src/RaceIntelligence.Persistence --output docs/schema.sql
          git diff --exit-code -- docs/schema.sql \
            || { echo "::error file=docs/schema.sql::Out of date. Regenerate it in the same commit as the migration: dotnet ef migrations script --project src/RaceIntelligence.Persistence --output docs/schema.sql"; exit 1; }

      - name: Build
        # Directory.Build.props already sets TreatWarningsAsErrors=true; -warnaserror also promotes
        # warnings raised outside that property's reach. The repo builds with zero warnings today,
        # so anything new here is a genuine regression and must fail the run rather than scroll by.
        # --no-incremental forces a full compile so a warning cannot be skipped as up-to-date.
        run: dotnet build RaceIntelligence.slnx --configuration Release --no-restore --no-incremental -warnaserror

      - name: Test
        # Every suite except the RaceRoom connector, which is covered by the windows job below.
        # Listed explicitly rather than filtered: if a new test project is added and nobody adds it
        # here, that is visible in this file rather than silently unrun.
        #
        # Two things here are load-bearing and were both verified by running them in a Linux
        # container, because getting either wrong fails quietly rather than loudly:
        #   - the full .csproj path, not the directory: a directory reports "No test projects were
        #     found" instead of running anything;
        #   - no --no-build: these projects run on Microsoft.Testing.Platform, and --no-build makes
        #     discovery report "No test projects were found" too. Rebuilding costs seconds.
        run: |
          dotnet test tests/RaceIntelligence.Analysis.Tests/RaceIntelligence.Analysis.Tests.csproj --configuration Release
          dotnet test tests/RaceIntelligence.Collector.Plugins.Ingest.Tests/RaceIntelligence.Collector.Plugins.Ingest.Tests.csproj --configuration Release
          dotnet test tests/RaceIntelligence.Collector.Plugins.Live.Tests/RaceIntelligence.Collector.Plugins.Live.Tests.csproj --configuration Release
          dotnet test tests/RaceIntelligence.Collector.Tests/RaceIntelligence.Collector.Tests.csproj --configuration Release
          dotnet test tests/RaceIntelligence.Core.Tests/RaceIntelligence.Core.Tests.csproj --configuration Release
          dotnet test tests/RaceIntelligence.Ingest.Api.Tests/RaceIntelligence.Ingest.Api.Tests.csproj --configuration Release
          dotnet test tests/RaceIntelligence.Live.Contracts.Tests/RaceIntelligence.Live.Contracts.Tests.csproj --configuration Release
          dotnet test tests/RaceIntelligence.Persistence.Tests/RaceIntelligence.Persistence.Tests.csproj --configuration Release
          dotnet test tests/RaceIntelligence.Web.Tests/RaceIntelligence.Web.Tests.csproj --configuration Release

  # The dashboard. Separate from the .NET jobs because it needs Node rather than the SDK, and
  # because a TypeScript error should read as a frontend failure rather than as part of a build log
  # for six C# projects.
  #
  # The bundle this produces is not published from here — `dotnet publish` rebuilds it. This job
  # exists to fail the PR when the dashboard does not typecheck, test or build, which is otherwise
  # only discovered at deploy time: nothing in the .NET build compiles a .tsx file.
  dashboard:
    name: Build and test (dashboard)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: src/RaceIntelligence.Web/ClientApp

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/RaceIntelligence.Web/ClientApp/package-lock.json

      # `ci` rather than `install`: it installs exactly what the lock file pins and fails if the
      # lock file and package.json disagree, so CI cannot pass against dependencies a developer's
      # machine never had.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npx vite build

  # The RaceRoom connector reads the sim's shared memory through a *named* memory-mapped file
  # (MemoryMappedFile.OpenExisting(name, ...)), and named maps are a Windows-only feature — on Unix
  # they throw PlatformNotSupportedException. So this suite cannot run on the Linux job, and
  # skipping it there instead would leave the interop code with no CI coverage at all.
  # Windows runners have no Linux Docker, which is why they run only this suite: it needs no
  # container, and everything that does stays on the Linux job.
  windows:
    name: Connector interop tests (Windows)
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Test
        # Builds as part of the run: this job compiles only the connector suite and its references,
        # so a separate build step would duplicate that work for no extra signal. The Linux job is
        # the one that enforces a zero-warning full-solution compile.
        run: dotnet test tests/RaceIntelligence.Connectors.RaceRoom.Tests/RaceIntelligence.Connectors.RaceRoom.Tests.csproj --configuration Release
